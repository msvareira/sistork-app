services:
  # 🤖 Ollama AI Service - Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: sistork-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - sistork-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: sistork-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistork_db
    ports:
      - "3344:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - sistork-network

  laravel:
    image: php:8.2-apache
    container_name: sistork-laravel
    working_dir: /var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sistork_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - ./back:/var/www/html
    ports:
      - "8044:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sistork-network
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y git unzip libpng-dev libonig-dev libxml2-dev &&
        docker-php-ext-install pdo pdo_mysql mbstring exif pcntl bcmath gd &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        cd /var/www/html &&
        composer install --no-dev --optimize-autoloader &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan migrate --force &&
        php artisan db:seed --class=AdminUserSeeder --force &&
        a2enmod rewrite &&
        echo '<VirtualHost *:80>
            DocumentRoot /var/www/html/public
            <Directory /var/www/html/public>
                AllowOverride All
                Require all granted
            </Directory>
        </VirtualHost>' > /etc/apache2/sites-available/000-default.conf &&
        apache2-foreground
      "

  frontend:
    image: node:20-alpine
    container_name: sistork-frontend
    working_dir: /app
    volumes:
      - ./project:/app
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8044
    networks:
      - sistork-network
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  mysql_data:
  ollama_data:

networks:
  sistork-network:
    driver: bridge
