<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Autenticação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Teste de Autenticação - SisTork</h1>
    
    <div class="container">
        <h3>1. Teste de Conexão com API</h3>
        <button onclick="testAPI()">Testar API Health</button>
        <div id="api-result" class="result"></div>
    </div>

    <div class="container">
        <h3>2. Login</h3>
        <input type="email" id="email" placeholder="Email" value="admin@oficina.com"><br>
        <input type="password" id="password" placeholder="Senha" value="admin123"><br>
        <button onclick="login()">Fazer Login</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="container">
        <h3>3. Verificar Usuário Logado</h3>
        <button onclick="getCurrentUser()">Obter Usuário Atual</button>
        <div id="user-result" class="result"></div>
    </div>

    <div class="container">
        <h3>4. Logout</h3>
        <button onclick="logout()">Fazer Logout</button>
        <div id="logout-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8044/api';
        let authToken = localStorage.getItem('auth_token');

        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `API OK: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Erro na API: ${error.message}`;
            }
        }

        async function login() {
            const resultDiv = document.getElementById('login-result');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('auth_token', authToken);
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `Login realizado com sucesso!<br>Token: ${authToken.substring(0, 50)}...<br>Usuário: ${data.user.name}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `Erro no login: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Erro na requisição: ${error.message}`;
            }
        }

        async function getCurrentUser() {
            const resultDiv = document.getElementById('user-result');
            
            if (!authToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Não logado. Faça login primeiro.';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/user`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json',
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `Usuário atual: ${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `Erro: ${JSON.stringify(data, null, 2)}`;
                    if (response.status === 401) {
                        localStorage.removeItem('auth_token');
                        authToken = null;
                    }
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Erro na requisição: ${error.message}`;
            }
        }

        async function logout() {
            const resultDiv = document.getElementById('logout-result');
            
            if (!authToken) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Não logado.';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'application/json',
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    localStorage.removeItem('auth_token');
                    authToken = null;
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `Logout realizado com sucesso: ${data.message}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `Erro no logout: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Erro na requisição: ${error.message}`;
            }
        }

        // Verificar se já tem token armazenado
        window.onload = function() {
            if (authToken) {
                document.getElementById('login-result').innerHTML = 'Token encontrado no localStorage';
                document.getElementById('login-result').className = 'result success';
            }
        }
    </script>
</body>
</html>
