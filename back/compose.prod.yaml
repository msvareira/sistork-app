services:
  web:
    image: nginx:latest
    volumes:
      - ./:/var/www
      - ./docker/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
    networks:
      - laravel-production
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    env_file:
      - .env
    volumes:
      - ./:/var/www
    networks:
      - laravel-production
    depends_on:
      mysql:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DATABASE:-app}
      - MYSQL_USER=${DB_USERNAME:-laravel}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - mysql-data-production:/var/lib/mysql
    networks:
      - laravel-production
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:alpine
    networks:
      - laravel-production

networks:
  laravel-production:

volumes:
  mysql-data-production:
