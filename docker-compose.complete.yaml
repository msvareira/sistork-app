version: '3.8'

services:
  # 🌐 Frontend React + Vite
  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    container_name: sistork-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./project:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8044/api
      - VITE_APP_NAME=SisTork
    networks:
      - sistork-network
    depends_on:
      - backend
    restart: unless-stopped

  # 🤖 Ollama AI Service - Local LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: sistork-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - sistork-network
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # 🚀 Backend Laravel + PHP + Apache  
  backend:
    image: php:8.2-apache
    container_name: sistork-backend
    ports:
      - "8044:80"
    volumes:
      - ./back:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sistork
      - DB_USERNAME=sistork
      - DB_PASSWORD=sistork123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    working_dir: /var/www/html
    networks:
      - sistork-network
    depends_on:
      - mysql
      - redis
    command: >
      bash -c "
        # Instalar extensões PHP necessárias
        apt-get update &&
        apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev libzip-dev git unzip &&
        docker-php-ext-configure gd --with-freetype --with-jpeg &&
        docker-php-ext-install gd pdo pdo_mysql zip &&
        
        # Configurar Apache
        a2enmod rewrite &&
        echo 'DocumentRoot /var/www/html/public' > /etc/apache2/sites-available/000-default.conf &&
        echo '<VirtualHost *:80>' >> /etc/apache2/sites-available/000-default.conf &&
        echo '    DocumentRoot /var/www/html/public' >> /etc/apache2/sites-available/000-default.conf &&
        echo '    <Directory /var/www/html/public>' >> /etc/apache2/sites-available/000-default.conf &&
        echo '        AllowOverride All' >> /etc/apache2/sites-available/000-default.conf &&
        echo '        Require all granted' >> /etc/apache2/sites-available/000-default.conf &&
        echo '    </Directory>' >> /etc/apache2/sites-available/000-default.conf &&
        echo '</VirtualHost>' >> /etc/apache2/sites-available/000-default.conf &&
        
        # Instalar Composer
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        
        # Aguardar MySQL (método mais simples)
        echo 'Aguardando MySQL...' &&
        sleep 30 &&
        echo 'Tempo de espera concluído!' &&
        
        # Instalar dependências se necessário
        if [ ! -d vendor ]; then
          composer install --no-dev --optimize-autoloader
        fi &&
        
        # Executar migrações (ignorar erros iniciais)
        php artisan migrate --force || true &&
        
        # Definir permissões
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
        chmod -R 755 /var/www/html/storage /var/www/html/bootstrap/cache &&
        
        # Iniciar Apache
        apache2-foreground
      "
    restart: unless-stopped

  # 🗄️ MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sistork-mysql
    ports:
      - "3345:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sistork
      - MYSQL_USER=sistork
      - MYSQL_PASSWORD=sistork123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sistork-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # 🔴 Redis Cache
  redis:
    image: redis:alpine
    container_name: sistork-redis
    networks:
      - sistork-network
    restart: unless-stopped

# 🌐 Networks
networks:
  sistork-network:
    driver: bridge

# 💾 Volumes
volumes:
  mysql_data:
  ollama_data:
